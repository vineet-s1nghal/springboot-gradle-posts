/*
 * posts-application/build.gradle
 * 
 * APPLICATION MODULE - Use cases and business operations
 * 
 * This module contains:
 * - Use cases (CreatePostUseCase, GetPostUseCase, etc.)
 * - Ports/Interfaces (PostRepository interface)
 * - Application-level exceptions (PostNotFoundException)
 * 
 * This module:
 * - DEPENDS ON: posts-domain (can use domain entities)
 * - DOES NOT depend on: Spring, JPA, or any framework
 * 
 * Why separate from domain?
 * - Domain = WHAT your business concepts are (Post entity)
 * - Application = WHAT operations you can do (create, read, update, delete)
 * 
 * Why no frameworks?
 * - Use cases are pure business logic
 * - Should be testable without starting Spring
 * - Interfaces (ports) define WHAT we need, not HOW it's implemented
 */

plugins {
    // java-library plugin enables 'api' dependency configuration
    // 'api' exposes dependencies to consumers (unlike 'implementation')
    id 'java-library'
}

dependencies {
    // Depend on the domain module
    // Using 'api' instead of 'implementation' so that:
    // - posts-application can use domain classes
    // - posts-infrastructure (which depends on application) can ALSO use domain classes
    // 
    // 'implementation' = dependency is private, not exposed to consumers
    // 'api' = dependency is exposed to consumers (transitive)
    api project(':posts-domain')
}
