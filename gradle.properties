# =============================================================================
# Gradle Properties
# =============================================================================
# These settings affect how Gradle runs (performance, memory, etc.)

# JVM arguments for the Gradle daemon
# -Xmx2048m = Maximum 2GB heap memory
# -XX:+HeapDumpOnOutOfMemoryError = Create heap dump if OOM occurs (helps debugging)
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError

# Build modules in parallel (faster builds on multi-core machines)
org.gradle.parallel=true

# Enable build caching (reuse outputs from previous builds)
org.gradle.caching=true

# Show more detailed output during builds (useful for debugging)
# Set to 'quiet' for minimal output, 'lifecycle' for normal, 'info' for more
org.gradle.logging.level=lifecycle
